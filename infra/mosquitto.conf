# Mosquitto MQTT Broker Configuration — BlockLock
# Place at: /etc/mosquitto/mosquitto.conf on your DigitalOcean server

# --- Standard unencrypted listener (local only, for testing) ---
listener 1883 127.0.0.1
allow_anonymous false

# --- TLS listener (for ESP32 and external connections) ---
listener 8883
allow_anonymous false

# TLS certificates — copies of the Let's Encrypt cert kept in a location the
# 'mosquitto' user can actually read. The real /etc/letsencrypt/archive/**
# directory is root-only (0700), which mosquitto (an unprivileged user) can't
# traverse, so setup.sh copies certs here and a renewal deploy-hook re-copies
# them (and reloads mosquitto) whenever certbot renews.
cafile   /etc/mosquitto/certs/chain.pem
certfile /etc/mosquitto/certs/cert.pem
keyfile  /etc/mosquitto/certs/privkey.pem

tls_version tlsv1.2

# --- Authentication ---
password_file /etc/mosquitto/passwd

# --- Persistence ---
persistence true
persistence_location /var/lib/mosquitto/

# --- Logging ---
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type information
log_timestamp true

# --- Connection limits ---
max_connections 50
max_inflight_messages 20
